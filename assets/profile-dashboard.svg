<svg width="1200" height="660" viewBox="0 0 1200 660" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1200" y2="660" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070611"/>
      <stop offset="0.52" stop-color="#0B0818"/>
      <stop offset="1" stop-color="#050A12"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7C3AED"/>
      <stop offset="0.55" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="avatarRing" x1="118" y1="72" x2="250" y2="214" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.45" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="avatarFill" cx="0" cy="0" r="1" gradientTransform="translate(184 144) rotate(90) scale(70)">
      <stop stop-color="#34205A"/>
      <stop offset="1" stop-color="#121126"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smallGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="avatarClip"><circle cx="184" cy="144" r="62"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #8B8AA4; }
      .label { fill: #BBB7D1; font-size: 14px; }
      .value { fill: #F8F7FF; font-size: 18px; font-weight: 700; }
      .card { fill: #0F0C1E; stroke: #322A52; stroke-width: 1.2; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
      .pulse2 { animation: pulse 2.8s ease-in-out 1.2s infinite; transform-origin: center; }
      .dash { stroke-dasharray: 7 9; animation: dash 10s linear infinite; }
      .scan { animation: scan 5s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:.55 } 50% { opacity:1 } }
      @keyframes dash { to { stroke-dashoffset:-160 } }
      @keyframes scan { 0%,100% { transform:translateY(-12px); opacity:0 } 15%,85% { opacity:.5 } 50% { transform:translateY(245px); opacity:.2 } }
    </style>
  </defs>

  <rect width="1200" height="660" rx="28" fill="url(#page)"/>
  <circle cx="1105" cy="50" r="190" fill="#7C3AED" opacity=".055"/>
  <circle cx="430" cy="640" r="240" fill="#22D3EE" opacity=".025"/>

  <!-- left profile rail -->
  <rect x="24" y="24" width="326" height="612" rx="24" fill="#0B0918" stroke="#352A5C" stroke-width="1.5"/>
  <rect x="25" y="25" width="324" height="5" rx="3" fill="url(#purple)"/>
  <circle cx="184" cy="144" r="71" fill="none" stroke="url(#avatarRing)" stroke-width="5" filter="url(#softGlow)" class="pulse"/>
  <circle cx="184" cy="144" r="62" fill="url(#avatarFill)"/>
  <text x="184" y="156" text-anchor="middle" fill="#F2EFFF" font-size="38" font-weight="800" class="sans">YKJ</text>
