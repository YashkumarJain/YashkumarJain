<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B12"/>
      <stop offset="0.55" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#07131A"/>
    </linearGradient>
    <linearGradient id="border" x1="78" y1="42" x2="1120" y2="376" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39FFB6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="line1"><rect x="151" y="141" width="0" height="31"><animate attributeName="width" values="0;800;800" keyTimes="0;0.4;1" dur="7s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="line2"><rect x="151" y="192" width="0" height="31"><animate attributeName="width" values="0;0;820;820" keyTimes="0;0.35;0.72;1" dur="7s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="line3"><rect x="151" y="243" width="0" height="31"><animate attributeName="width" values="0;0;0;760;760" keyTimes="0;0.58;0.66;0.92;1" dur="7s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <circle cx="1080" cy="70" r="135" fill="#38BDF8" opacity="0.035"/>
  <circle cx="104" cy="368" r="180" fill="#39FFB6" opacity="0.025"/>

  <rect x="73" y="39" width="1054" height="342" rx="18" fill="#0A0F16" stroke="url(#border)" stroke-width="2"/>
  <rect x="74" y="40" width="1052" height="58" rx="17" fill="#111827"/>
  <path d="M74 81H1126" stroke="#263244"/>
  <circle cx="108" cy="69" r="8" fill="#FF5F57"/>
  <circle cx="136" cy="69" r="8" fill="#FFBD2E"/>
  <circle cx="164" cy="69" r="8" fill="#28C840"/>
  <text x="600" y="75" fill="#7E8A9A" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">yash@github — portfolio</text>

  <text x="112" y="160" fill="#39FFB6" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$</text>
  <g clip-path="url(#line1)">
    <text x="151" y="160" fill="#E6EDF3" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">whoami</text>
    <text x="300" y="160" fill="#7E8A9A" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">→</text>
    <text x="340" y="160" fill="#38BDF8" font-size="24" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Yash Jain</text>
  </g>

  <text x="112" y="211" fill="#39FFB6" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$</text>
  <g clip-path="url(#line2)">
    <text x="151" y="211" fill="#E6EDF3" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">cat focus.txt</text>
    <text x="356" y="211" fill="#7E8A9A" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">→</text>
    <text x="396" y="211" fill="#38BDF8" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ML · NLP · Document AI</text>
  </g>

  <text x="112" y="262" fill="#39FFB6" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$</text>
  <g clip-path="url(#line3)">
    <text x="151" y="262" fill="#E6EDF3" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">echo $EDUCATION</text>
    <text x="382" y="262" fill="#7E8A9A" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">→</text>
    <text x="422" y="262" fill="#38BDF8" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">MS Computer Science @ USC</text>
  </g>

  <text x="112" y="326" fill="#39FFB6" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">yash@github:~$</text>
  <rect x="292" y="307" width="12" height="24" rx="1" fill="#39FFB6" filter="url(#glow)">
    <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
