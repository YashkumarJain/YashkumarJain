<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-labelledby="title desc">
  <title id="title">About Yashkumar Jain</title>
  <desc id="desc">Yashkumar Jain is an applied AI engineer and USC graduate student building reliable language model and document intelligence systems.</desc>
  <defs>
    <linearGradient id="aboutBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0a1824"/>
      <stop offset="0.58" stop-color="#0d1f2a"/>
      <stop offset="1" stop-color="#091b18"/>
    </linearGradient>
    <linearGradient id="aboutLine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2f81f7"/>
      <stop offset="0.5" stop-color="#20c9e8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="aboutGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="998" height="268" rx="18" fill="url(#aboutBg)" stroke="#263541" stroke-width="2"/>
  <rect x="0" y="0" width="1000" height="4" rx="2" fill="url(#aboutLine)"/>

  <text x="40" y="53" fill="#16e0a4" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2">ABOUT / CURRENT DIRECTION</text>
  <text x="40" y="94" fill="#f0f7ff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Applied AI, engineered for the real world.</text>
  <text x="40" y="130" fill="#a9becc" font-family="Arial, Helvetica, sans-serif" font-size="16">I’m an MS Computer Science student at USC building reliable AI products with a focus on</text>
  <text x="40" y="154" fill="#a9becc" font-family="Arial, Helvetica, sans-serif" font-size="16">grounded retrieval, evaluation, clean APIs and systems that remain useful beyond the demo.</text>

  <g transform="translate(40 190)">
    <rect width="286" height="52" rx="9" fill="#0d1d2a" stroke="#244052"/>
    <circle cx="21" cy="20" r="5" fill="#20c9e8" filter="url(#aboutGlow)"/>
    <text x="38" y="24" fill="#eaf7ff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">BUILDING NOW</text>
    <text x="20" y="43" fill="#8fa4b5" font-family="Arial, Helvetica, sans-serif" font-size="12">DocMind · LLM/RAG capstone</text>
  </g>
  <g transform="translate(357 190)">
    <rect width="286" height="52" rx="9" fill="#0b211f" stroke="#1d5147"/>
    <circle cx="21" cy="20" r="5" fill="#16e0a4" filter="url(#aboutGlow)"/>
    <text x="38" y="24" fill="#eafff9" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">RESEARCHING</text>
    <text x="20" y="43" fill="#8fa4b5" font-family="Arial, Helvetica, sans-serif" font-size="12">Robust ML under domain shift</text>
  </g>
  <g transform="translate(674 190)">
    <rect width="286" height="52" rx="9" fill="#0d1d2a" stroke="#244052"/>
    <circle cx="21" cy="20" r="5" fill="#22c55e" filter="url(#aboutGlow)"/>
    <text x="38" y="24" fill="#eaf7ff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">TARGETING</text>
    <text x="20" y="43" fill="#8fa4b5" font-family="Arial, Helvetica, sans-serif" font-size="12">Summer 2027 AI/ML internships</text>
  </g>
</svg>
